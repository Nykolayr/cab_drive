org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
# MapKit 4.22+ AAR is Java 21 bytecode; JDK 17 javac cannot read it (class 65 vs 61).
org.gradle.java.home=C:\\Program Files\\Java\\jdk-21
android.useAndroidX=true
# Jetifier нужен части зависимостей (support vs AndroidX); выключать только после проверки.
android.enableJetifier=true
android.enableR8=true
# Suggest/Search (center coords) — без full каналы yandex_suggest/yandex_search не регистрируются.
yandexMapkit.variant=full
kotlin.jvm.target.validation.mode = IGNORE
# Pub cache on C:, project on D: — Kotlin incremental falls with "different roots"
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.network.retry.count=8
systemProp.org.gradle.internal.network.retry.max-backoff-time=10000
systemProp.org.gradle.internal.http.useHttp2=false
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.max.tentatives=10
systemProp.org.gradle.internal.repository.initial.backoff=500
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
