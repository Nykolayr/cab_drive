<!doctype html>
<html lang="ru">

<head>

    <meta charset="utf-8" />
    <title>{{ config.PROJECT_NAME }} - Авторизация</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="{{ config.PROJECT_NAME }}" name="description" />
    <!-- App favicon -->
    <link rel="shortcut icon" href="../../static/assets/images/favicon.ico">

    <!-- Bootstrap Css -->
    <link href="../../static/assets/css/bootstrap.min.css" id="bootstrap-style" rel="stylesheet" type="text/css" />
    <!-- Icons Css -->
    <link href="../../static/assets/css/icons.min.css" rel="stylesheet" type="text/css" />
    <!-- App Css-->
    <link href="../../static/assets/css/app.min.css" id="app-style" rel="stylesheet" type="text/css" />

    <!-- Sweet Alert-->
    <link href="../../static/assets/libs/sweetalert2/sweetalert2.min.css" rel="stylesheet" type="text/css" />

</head>

<body class="bg-pattern">
<div class="bg-overlay"></div>
<div class="account-pages my-5 pt-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-4 col-lg-6 col-md-8">
                <div class="card">
                    <div class="card-body p-4">
                        <div class="">
                            <div class="text-center">
                                <a href="{{ url_for('d.home') }}" class="">
                                    <img src="../../static/assets/images/logo-sm.png" alt="" height="24" class="auth-logo logo-dark mx-auto">
                                    <img src="../../static/assets/images/logo-sm.png" alt="" height="24" class="auth-logo logo-light mx-auto">
                                </a>
                            </div>
                            <!-- end row -->
                            <h4 class="font-size-18 text-muted mt-3 text-center">Добро пожаловать</h4>
                            <div class="row">
                                <form action="#" onsubmit="auth()">
                                    <div class="col-md-12">
                                        <div>
                                            <label for="phone">Номер телефона</label>
                                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="Номер телефона">
                                        </div>
                                        <div class="mt-3">
                                            <label for="password">Пароль</label>
                                            <input type="password" class="form-control" id="password" name="password" placeholder="Пароль">
                                        </div>

                                        <div class="d-grid mt-4">
                                            <button class="btn btn-primary waves-effect waves-light" type="submit">Войти</button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- end row -->
    </div>
</div>
<!-- end Account pages -->

<!-- JAVASCRIPT -->
<script src="../../static/assets/libs/jquery/jquery.min.js"></script>
<script src="../../static/assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../../static/assets/libs/metismenu/metisMenu.min.js"></script>
<script src="../../static/assets/libs/simplebar/simplebar.min.js"></script>
<script src="../../static/assets/libs/node-waves/waves.min.js"></script>
<script src="../../static/assets/libs/sweetalert2/sweetalert2.min.js"></script>

<script src="../../static/assets/js/app.js"></script>


<script>

    function auth(){
        event.stopPropagation();
        event.preventDefault();
        let data = {
            'phone': phone.value,
            'password': password.value,
        }

        $.ajax({
            url: '/d/auth',
            method: 'POST',
            data: data,
            success: function (msg) {
                console.log(msg)
                if(msg['status'] !== 'ok'){
                    return showError(msg['message']);
                }
                showSuccess('Авторизация', msg['message'], function (){
                    location.href = '/d/statistics';
                })
            }
        });
        return false;
    }

    function showError(msg){
        Swal.fire({
            title: 'Ошибка',
            text: msg,
            icon: 'error',
            confirmButtonText: 'Ок'
        })
    }

    function showSuccess(title, msg, callback=null){
        Swal.fire({
            title: title,
            text: msg,
            icon: 'success',
            confirmButtonText: 'Ок'
        }).then(function (){
            if(callback !== null) callback();
        })
    }

</script>

</body>
</html>
